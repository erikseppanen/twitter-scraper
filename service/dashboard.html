<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitter Likes Archive</title>
<style>:root{color-scheme:light dark;--bg:#fff;--text:#0f1419;--muted:#536471}@media(prefers-color-scheme:dark){:root{--bg:#000;--text:#e7e9ea;--muted:#71767b}}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}main{max-width:360px;padding:24px;text-align:center}h1{font-size:23px;margin:0 0 8px}p{color:var(--muted);margin:0}</style>
<main><h1>Twitter Likes Archive</h1><p id="message" role="status">Opening your archive…</p></main>
<script>
// The private bookmark carries its secret in the fragment. Exchange it for a session
// cookie, remove it from the address bar, then open the app or the page that was requested.
const message = document.querySelector('#message');
const requested = new URLSearchParams(location.search).get('next') || sessionStorage.getItem('archiveNext');
const next = /^\/(?:tweet\/\d+|archive\/[^#]*|app\/[\w\/-]*|knowledge(?:\/tweet\/\d+)?)(?:\?[^#]*)?$/.test(requested || '') ? requested : null;
if (next) sessionStorage.setItem('archiveNext', next);
async function unlock() {
  const token = location.hash.slice(1);
  if (token) {
    history.replaceState(null, '', location.pathname + location.search);
    const response = await fetch('/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    if (!response.ok) { message.textContent = 'This private link is invalid.'; return; }
  }
  const status = await fetch('/api/status');
  if (!status.ok) { message.textContent = 'Open your private bookmark to access the archive.'; return; }
  sessionStorage.removeItem('archiveNext');
  location.replace(next || '/app/');
}
const failed = () => { message.textContent = 'Could not reach the Mini.'; };
addEventListener('hashchange', () => unlock().catch(failed));
unlock().catch(failed);
</script></html>
