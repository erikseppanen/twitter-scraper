<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Likes Exporter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        width: 260px;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      button {
        width: 100%;
        padding: 8px 10px;
        margin: 6px 0;
        border: 1px solid #8884;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      #status { font-size: 12px; opacity: 0.8; margin-top: 6px; }
      .hint { font-size: 11px; opacity: 0.7; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Twitter Likes Exporter</h1>
    <button id="export">Export new likes</button>
    <button id="stop">Stop export</button>
    <button id="baseline">Set current as baseline</button>
    <button id="pick-baseline">Pick baseline by click</button>
    <button id="reset">Reset last seen</button>
    <div id="status">Open your Likes page on x.com, then set baseline.</div>
    <div class="hint" id="baseline-display">Baseline: not set</div>
    <div class="hint" id="baseline-id"></div>
    <div class="hint">Exports tweet IDs to a .txt file.</div>
    <script src="popup.js"></script>
  </body>
</html>
