<style>
/* Layout: a comic book page. Ink-outlined panels on a halftone sky, read left to right, top to bottom. */
:root {
  --ink: #1d1a2b;
  --paper: #ffffff;
  --sky: #e6efff;
  --dots: #c4d6fb;
  --caption: #ffe14d;
  --red: #e8483b;
  --note: #44405a;
  --display: 'Bangers', 'Impact', 'Arial Black', sans-serif;
  --hand: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--sky) radial-gradient(var(--dots) 1.6px, transparent 1.8px) 0 0 / 14px 14px;
  color: var(--ink);
  font-family: var(--hand);
  font-size: 18px;
  line-height: 1.35;
  padding: 28px 16px 56px;
}
.book { max-width: 1060px; margin: 0 auto; display: grid; gap: 28px; }
header.cover {
  background: var(--red);
  color: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 7px 7px 0 var(--ink);
  padding: 22px 26px 20px;
  transform: rotate(-0.6deg);
}
header.cover h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(40px, 7vw, 76px);
  letter-spacing: 0.03em;
  line-height: 0.95;
  margin: 0;
  text-wrap: balance;
  text-shadow: 3px 3px 0 var(--ink);
}
header.cover p { margin: 10px 0 0; font-size: 20px; max-width: 62ch; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel {
  margin: 0;
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  display: flex;
  flex-direction: column;
}
.cap {
  background: var(--caption);
  border-bottom: 4px solid var(--ink);
  padding: 10px 14px 11px;
  font-size: 18px;
}
.cap b {
  display: block;
  font-family: var(--display);
  font-weight: 400;
  font-size: 25px;
  letter-spacing: 0.04em;
  line-height: 1.05;
  margin-bottom: 3px;
}
.cap b span { color: var(--red); margin-right: 6px; }
.panel svg { display: block; width: 100%; height: auto; flex: 1; }
.panel svg text { font-family: var(--hand); font-size: 15px; fill: var(--ink); }
.panel svg text.small { font-size: 13px; }
.panel svg text.bang { font-family: var(--display); font-size: 22px; letter-spacing: 0.04em; }
.note {
  margin: 0;
  border-top: 3px dashed var(--ink);
  padding: 9px 14px 11px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--note);
  overflow-wrap: anywhere;
}
.note code { color: var(--ink); font-weight: 500; }
.end { background: var(--caption); }
.end .cap { background: var(--ink); color: var(--paper); }
.end ol { margin: 0; padding: 14px 18px 16px 44px; display: grid; gap: 6px; font-size: 19px; }
.end ol li::marker { font-family: var(--display); color: var(--red); }
.end p { margin: 0; padding: 0 18px 16px; font-size: 16px; }
.back { justify-self: start; font-family: var(--display); font-size: 20px; letter-spacing: 0.04em;
  color: var(--ink); background: var(--paper); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 4px 12px; text-decoration: none; }
.back:hover { background: var(--caption); }
</style>
</head>

<div class="book">
  <a class="back" href="./">&larr; Back to the guide</a>
  <header class="cover">
    <h1>How Your Likes Archive Works</h1>
    <p>A comic about the Mac Mini, the laptop and the little programs that save your liked tweets. Every panel ends with the real file or command, so you can look it up.</p>
  </header>

  <div class="grid">

    <!-- 1 -->
    <figure class="panel">
      <figcaption class="cap"><b><span>1</span>Meet the cast</b>Two computers. The laptop is the workshop. The Mac Mini is the house where the archive actually lives and runs.</figcaption>
      <svg viewBox="0 0 400 250" role="img" aria-label="The laptop and the Mac Mini introduce themselves">
        <path d="M0 240 H400" stroke="#1d1a2b" stroke-width="3"/>
        <use href="#laptop" x="20" y="122" width="140" height="111"/>
        <use href="#mini" x="215" y="150" width="170" height="91"/>
        <g><path d="M70 74 L82 116 L100 74 Z" fill="#fff" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round"/>
          <rect x="12" y="14" width="186" height="62" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="3"/>
          <text x="25" y="39"><tspan x="25">I'm the laptop. The code</tspan><tspan x="25" dy="19">lives here, in Git.</tspan></text></g>
        <g><path d="M285 118 L298 158 L314 118 Z" fill="#fff" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round"/>
          <rect x="208" y="36" width="182" height="84" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="3"/>
          <text x="221" y="61"><tspan x="221">I'm the Mac Mini. I run</tspan><tspan x="221" dy="19">everything, and I keep</tspan><tspan x="221" dy="19">all your likes.</tspan></text></g>
      </svg>
      <p class="note">Laptop: the Git repo, where Claude Code edits. Mini: <code>~/twitter-scraper</code>, a plain copy (not a Git checkout).</p>
    </figure>

    <!-- 2 -->
    <figure class="panel">
      <figcaption class="cap"><b><span>2</span>Moving day</b>New code travels to the Mini over SSH, like a box of parts. Nothing happens automatically, and the Mini has no Git.</figcaption>
      <svg viewBox="0 0 400 250" role="img" aria-label="The laptop sends a box of code to the Mini">
        <path d="M0 240 H400" stroke="#1d1a2b" stroke-width="3"/>
        <use href="#laptop" x="10" y="140" width="120" height="95"/>
        <use href="#mini" x="250" y="162" width="140" height="75"/>
        <path d="M118 142 H138 M112 158 H136 M118 174 H138" stroke="#1d1a2b" stroke-width="3" stroke-linecap="round"/>
        <use href="#box" x="148" y="118" width="94" height="79"/>
        <text x="195" y="178" text-anchor="middle" class="small">code only</text>
        <text x="195" y="222" text-anchor="middle" class="bang" fill="#3a7bd5" style="fill:#3a7bd5">VIA SSH!</text>
        <g transform="rotate(-3 100 44)"><rect x="10" y="16" width="184" height="56" fill="#ffe14d" stroke="#1d1a2b" stroke-width="3"/>
          <text x="20" y="39" class="small"><tspan x="20">Deleted a file in Git?</tspan><tspan x="20" dy="18">Delete it on the Mini too.</tspan></text></g>
        <g><path d="M318 126 L326 160 L342 126 Z" fill="#fff" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round"/>
          <rect x="232" y="66" width="160" height="62" rx="16" fill="#fff" stroke="#1d1a2b" stroke-width="3"/>
          <text x="245" y="91"><tspan x="245">Code only, please.</tspan><tspan x="245" dy="19">My data stays put.</tspan></text></g>
      </svg>
      <p class="note"><code>git archive HEAD … | ssh MINI 'tar -xf - -C ~/twitter-scraper'</code>. The archive/ and .service/ folders are never in the box.</p>
    </figure>

    <!-- 3 -->
    <figure class="panel">
      <figcaption class="cap"><b><span>3</span>Unpack, test, restart</b>On the Mini: install packages if they changed, run every test, build the web app, then restart the service.</figcaption>

        <g><path d="M78 118 L92 154 L106 118 Z" fill="#fff" stroke="#1d1a2b" stroke-width="3" stroke-linejoin="round"/>

      <p class="note">Restart: <code>launchctl kickstart -k gui/$(id -u)/local.twitter-archive</code>. Or rerun <code>scripts/install-mini.sh</code>, which does all four.</p>
    </figure>

    <!-- 14 -->
    <figure class="panel end">
      <figcaption class="cap"><b><span>THE END</span>The whole story in one breath</b></figcaption>
      <ol>
        <li>Code is written on the laptop and copied to the Mini over SSH.</li>
        <li>launchd keeps one Node program running on the Mini.</li>
        <li>Every 4 hours Node wakes a windowless Chrome, which is still logged into X.</li>
        <li>Chrome lists the new like IDs down to last time's flag, then closes.</li>
        <li>The Clojure librarian fetches each tweet and its media into a copy.</li>
        <li>If everything checks out, the copy becomes the archive.</li>
        <li>Your phone gets in through the Funnel tunnel with the bookmark's secret, and reads it all.</li>
      </ol>
      <p>The full written version, with every command, is ARCHITECTURE.md in the repo.</p>
    </figure>
